<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Painel | Yale Barbosa</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;1,400;1,500&display=swap">
<link rel="stylesheet" href="estilo.css">
<style>
  main { padding-block: 28px 120px; }
  .aviso { background: var(--night); color: var(--on-night); font-size: 14px; padding: 10px 0; }
  .aviso b { color: var(--coin); }

  /* Topo e navegação */
  .topo .wrap { flex-wrap: wrap; row-gap: 8px; }
  .nav { display: flex; gap: 4px; background: var(--paper-2); border-radius: 999px; padding: 4px; }
  .nav a { text-decoration: none; color: var(--ink-soft); font-weight: 600; font-size: 14.5px; padding: 9px 16px; border-radius: 999px; transition: background .2s, color .2s; white-space: nowrap; }
  .nav a:hover { color: var(--ink); }
  .nav a.on { background: var(--night); color: var(--on-night); }
  .nav a .qt { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; margin-left: 6px; border-radius: 999px; background: var(--coin); color: var(--night); font-size: 11.5px; }
  .topo-dir { display: flex; align-items: center; gap: 6px; }
  .icone { width: 40px; height: 40px; border-radius: 12px; border: 0; background: transparent; color: var(--ink-soft); display: grid; place-items: center; cursor: pointer; text-decoration: none; flex: none; }
  .icone:hover { background: var(--paper-2); color: var(--ink); }
  .icone svg { width: 19px; height: 19px; }
  @media (max-width: 860px) {
    .topo .wrap { padding-bottom: 10px; }
    .nav { order: 3; width: 100%; overflow-x: auto; scrollbar-width: none; }
    .nav::-webkit-scrollbar { display: none; }
    .nav a { flex: 1; text-align: center; padding: 9px 12px; }
  }

  h1 { font-size: clamp(30px, 4vw, 42px); line-height: 1.12; }
  h2 { font-size: 24px; line-height: 1.2; }
  .cab { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 18px; margin-bottom: 26px; }
  .cab p { color: var(--ink-soft); margin-top: 6px; }
  .cab .eyebrow + h1 { margin-top: 12px; }
  .cab-acoes { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .suave { color: var(--ink-soft); }
  .pequeno { font-size: 13.5px; }

  /* Campos */
  label.campo { display: grid; gap: 6px; font-size: 13.5px; font-weight: 600; color: var(--ink); min-width: 0; align-content: start; }
  label.campo small { font-weight: 400; color: var(--ink-soft); }
  input[type=text], input[type=email], input[type=password], input[type=date], input[type=time], input[type=datetime-local], input[type=tel], input[type=number], input[type=search], select, textarea {
    width: 100%; min-width: 0; font: 400 15px/1.45 var(--body); color: var(--ink); background: #fff; border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; transition: border-color .2s, box-shadow .2s; }
  textarea { resize: vertical; min-height: 88px; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--coin); box-shadow: 0 0 0 3px color-mix(in srgb, var(--coin) 30%, transparent); }
  .grade { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .grade.tres { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .cheio { grid-column: 1 / -1; }

  .bloco { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: clamp(18px, 2.6vw, 26px); min-width: 0; }
  .bloco + .bloco { margin-top: 16px; }
  .bloco > h2 { font-size: 22px; }
  .bloco > .sub { color: var(--ink-soft); font-size: 14px; margin-top: 4px; margin-bottom: 16px; }
  .bloco-cab { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 14px; }
  .bloco-cab h2 { font-size: 22px; }
  .bloco-cab a { font-size: 14px; font-weight: 600; color: var(--ink); text-decoration: none; border-bottom: 1.5px solid var(--coin); }
  .vazio { color: var(--ink-soft); font-size: 14.5px; padding: 8px 0; }

  /* Login */
  .login { min-height: calc(100vh - 160px); display: grid; place-items: center; }
  .login-card { width: min(100%, 420px); background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 34px 28px; display: grid; gap: 18px; }
  .erro { color: var(--danger); font-size: 14px; }

  /* Início */
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 18px; }
  .kpi { min-width: 0; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 18px 20px; text-decoration: none; color: inherit; transition: border-color .25s, transform .25s var(--ease); }
  .kpi:hover { border-color: var(--coin); transform: translateY(-2px); }
  .kpi.noite { background: var(--night); border-color: var(--night); color: var(--on-night); }
  .kpi .l { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; color: var(--gold); }
  .kpi.noite .l { color: var(--coin); }
  .kpi .v { font-family: var(--display); font-size: clamp(28px, 3.4vw, 38px); line-height: 1.1; margin-top: 8px; font-variant-numeric: tabular-nums; }
  .kpi .s { font-size: 13.5px; color: var(--ink-soft); margin-top: 4px; }
  .kpi.noite .s { color: var(--on-night-soft); }
  .duas { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); gap: 16px; align-items: start; }
  .duas > div { min-width: 0; display: grid; gap: 16px; }
  .duas .bloco + .bloco { margin-top: 0; }

  .atencao { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .atencao a { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 12px; align-items: center; text-decoration: none; color: inherit; padding: 12px 14px; border-radius: 14px; background: #fff; border: 1px solid var(--line); transition: border-color .2s; }
  .atencao a:hover { border-color: var(--coin); }
  .atencao .p { width: 10px; height: 10px; border-radius: 50%; background: var(--coin); }
  .atencao .p.urg { background: var(--danger); }
  .atencao b { font-weight: 600; display: block; font-size: 15px; overflow-wrap: anywhere; }
  .atencao span.s { font-size: 13px; color: var(--ink-soft); }
  .atencao .q { font-size: 12.5px; font-weight: 600; color: var(--ink-soft); white-space: nowrap; }

  .dias { display: grid; gap: 18px; }
  .dia h3 { font-family: var(--body); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; color: var(--gold); margin-bottom: 8px; }
  .dia.hoje h3 { color: var(--night); }
  .comp { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px 12px; border-radius: 14px; background: #fff; border: 1px solid var(--line); }
  .comp + .comp { margin-top: 8px; }
  .comp .hr { font-family: var(--display); font-size: 17px; font-variant-numeric: tabular-nums; }
  .comp .hr.sem { font-family: var(--body); font-size: 12px; color: var(--ink-soft); }
  .comp a.t { text-decoration: none; color: var(--ink); font-weight: 600; font-size: 15px; display: block; overflow-wrap: anywhere; }
  .comp a.t:hover { color: var(--gold); }
  .comp .s { font-size: 13px; color: var(--ink-soft); }
  .tipo { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; margin-right: 6px; vertical-align: 1px; }
  .tipo.encontro { background: color-mix(in srgb, var(--coin) 30%, var(--card)); color: var(--night); }
  .tipo.diagnostico { background: var(--night); color: var(--coin); }
  .tipo.followup { background: var(--paper-2); color: var(--ink); }
  .gbtn { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--ink); text-decoration: none; padding: 7px 10px; border-radius: 10px; border: 1.5px solid var(--line); white-space: nowrap; }
  .gbtn:hover { border-color: var(--coin); }
  .gbtn svg { width: 14px; height: 14px; }

  .barras { display: grid; gap: 10px; }
  .barra-l { display: grid; grid-template-columns: 130px minmax(0, 1fr) 28px; gap: 10px; align-items: center; font-size: 14px; text-decoration: none; color: inherit; }
  .barra-l .trilho { height: 10px; border-radius: 999px; background: var(--paper-2); overflow: hidden; }
  .barra-l .enche { height: 100%; border-radius: 999px; background: var(--coin); }
  .barra-l b { text-align: right; font-variant-numeric: tabular-nums; }

  /* Funil */
  .quadro { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(160px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 10px; scroll-snap-type: x proximity; }
  .coluna { min-width: 0; background: var(--paper-2); border-radius: 20px; padding: 12px; display: flex; flex-direction: column; gap: 10px; min-height: 320px; scroll-snap-align: start; transition: box-shadow .2s, background .2s; }
  .coluna.alvo { background: color-mix(in srgb, var(--coin) 22%, var(--paper-2)); box-shadow: inset 0 0 0 2px var(--coin); }
  .col-cab { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 4px 6px 2px; }
  .col-cab h3 { font-family: var(--body); font-size: 14px; font-weight: 600; }
  .col-cab .n { font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .col-dica { font-size: 12.5px; color: var(--ink-soft); padding: 0 6px 4px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; cursor: pointer; text-align: left; font: inherit; color: inherit; display: grid; gap: 8px; transition: border-color .2s, box-shadow .2s, transform .2s var(--ease); width: 100%; }
  .card:hover { border-color: var(--coin); box-shadow: 0 14px 24px -20px rgba(27,31,39,.5); }
  .card.arrastando { opacity: .45; }
  .card b { font-size: 15.5px; font-weight: 600; overflow-wrap: anywhere; }
  .card .m { font-size: 13px; color: var(--ink-soft); }
  .card .pp { font-size: 13px; display: flex; gap: 6px; align-items: baseline; }
  .card .pp.atrasado { color: var(--danger); font-weight: 600; }
  .card .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font-size: 11.5px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: var(--paper-2); color: var(--ink); }
  .tag.ouro { background: color-mix(in srgb, var(--coin) 30%, var(--card)); }
  .largo { max-width: 1600px; }
  .quadro .card { padding: 12px; }
  .quadro .card b { font-size: 15px; }
  .soltar { position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 140%); z-index: 40; display: flex; gap: 12px; transition: transform .3s var(--ease); pointer-events: none; }
  .soltar.on { transform: translate(-50%, 0); pointer-events: auto; }
  .soltar div { min-width: 180px; padding: 16px 22px; border-radius: 18px; font-weight: 600; text-align: center; border: 2px dashed transparent; box-shadow: 0 18px 36px -16px rgba(27,31,39,.55); transition: transform .2s, border-color .2s; }
  .soltar .g { background: var(--coin); color: var(--night); }
  .soltar .p { background: var(--night); color: var(--on-night); }
  .soltar div.alvo { transform: scale(1.06); border-color: currentColor; }
  .coluna.ganho { background: color-mix(in srgb, var(--coin) 16%, var(--paper-2)); }
  .coluna.ganho .col-cab h3 { color: var(--gold); }
  .coluna.perdido { background: color-mix(in srgb, var(--line) 55%, var(--paper)); }
  .coluna.perdido .card { opacity: .78; }
  .card .ok { font-size: 13px; color: var(--gold); font-weight: 600; }
  .lista-simples { display: grid; gap: 8px; margin-top: 14px; }
  .lista-simples a { display: flex; justify-content: space-between; gap: 12px; text-decoration: none; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; font-size: 14.5px; }
  .lista-simples a:hover { border-color: var(--coin); }

  /* Lead */
  .voltar { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-soft); font: 600 14px var(--body); background: none; border: 0; padding: 0; cursor: pointer; margin-bottom: 16px; text-decoration: none; }
  .voltar:hover { color: var(--ink); }
  .pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 4px 11px; border-radius: 999px; background: var(--night); color: var(--coin); }
  .pill.claro { background: var(--paper-2); color: var(--ink); }
  .lead-grid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, .8fr); gap: 16px; align-items: start; }
  .lead-grid > div { min-width: 0; }
  .lead-grid .bloco + .bloco { margin-top: 16px; }
  .etapas-sel { display: flex; flex-wrap: wrap; gap: 6px; }
  .etapas-sel button { font: 600 13px var(--body); padding: 8px 12px; border-radius: 999px; border: 1.5px solid var(--line); background: #fff; color: var(--ink-soft); cursor: pointer; }
  .etapas-sel button:hover { border-color: var(--coin); color: var(--ink); }
  .etapas-sel button.on { background: var(--night); border-color: var(--night); color: var(--coin); }
  .hist { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 0; }
  .hist li { position: relative; padding: 0 0 16px 26px; }
  .hist li::before { content: ''; position: absolute; left: 5px; top: 8px; width: 9px; height: 9px; border-radius: 50%; background: var(--coin); }
  .hist li::after { content: ''; position: absolute; left: 9px; top: 20px; bottom: 0; width: 1.5px; background: var(--line); }
  .hist li:last-child::after { display: none; }
  .hist .q { font-size: 12.5px; color: var(--ink-soft); display: flex; gap: 8px; align-items: center; }
  .hist .q b { color: var(--gold); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; font-size: 11.5px; }
  .hist .x { margin-left: auto; background: none; border: 0; color: var(--ink-soft); cursor: pointer; font-size: 12px; padding: 0; }
  .hist .x:hover { color: var(--danger); }
  .hist p { font-size: 14.5px; margin-top: 2px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .add-hist { display: grid; gap: 10px; margin-top: 14px; }
  .add-hist .lin { display: flex; gap: 10px; }
  .add-hist select { width: auto; flex: none; }

  /* Clientes */
  .filtros { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .filtros button { font: 600 13.5px var(--body); padding: 8px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: transparent; color: var(--ink-soft); cursor: pointer; }
  .filtros button.on { background: var(--night); color: var(--on-night); border-color: var(--night); }
  .lista { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .cli { min-width: 0; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 20px; cursor: pointer; font: inherit; color: inherit; display: grid; gap: 12px; transition: transform .3s var(--ease), box-shadow .3s var(--ease), border-color .3s; text-decoration: none; }
  .cli:hover { transform: translateY(-3px); box-shadow: 0 20px 36px -26px rgba(27,31,39,.45); border-color: var(--coin); }
  .cli h3 { font-size: 21px; line-height: 1.25; overflow-wrap: anywhere; }
  .cli .meta { font-size: 13.5px; color: var(--ink-soft); }
  .mini { display: flex; gap: 5px; }
  .mini span { flex: 1; height: 6px; border-radius: 999px; background: var(--line); }
  .mini span.f { background: var(--coin); }
  .mini span.a { background: var(--night); }
  .cli-rodape { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13.5px; }

  /* Editor do cliente */
  .link-box { background: var(--night); color: var(--on-night); border-radius: 22px; padding: 20px 22px; display: grid; gap: 12px; margin-bottom: 16px; }
  .link-box .r { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .link-box input { flex: 1 1 260px; background: var(--night-2); border-color: var(--night-2); color: var(--on-night); font-size: 14px; }
  .link-box .lbl { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; color: var(--coin); }
  .link-box .btn.ghost { color: var(--on-night); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--on-night-soft) 45%, transparent); }
  .link-box .btn.ghost::before { background: var(--night-2); }
  .link-box .btn.ghost:hover { color: var(--on-night); }
  .link-off { color: var(--coin); font-size: 14px; }
  .reuniao { border: 1px solid var(--line); border-radius: 18px; background: #fff; margin-top: 10px; overflow: hidden; }
  .reuniao.feita { border-color: color-mix(in srgb, var(--coin) 70%, var(--line)); }
  .r-cab { display: grid; grid-template-columns: 40px 150px 96px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 10px 12px; }
  .r-num { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--line); font: italic 500 15px/1 var(--display); color: var(--ink-soft); }
  .reuniao.feita .r-num { background: var(--coin); border-color: var(--coin); color: var(--night); }
  .toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; cursor: pointer; white-space: nowrap; user-select: none; }
  .toggle input { appearance: none; -webkit-appearance: none; width: 40px; height: 24px; border-radius: 999px; background: var(--line); position: relative; cursor: pointer; transition: background .2s; margin: 0; flex: none; }
  .toggle input::after { content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .2s var(--ease); box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .toggle input:checked { background: var(--night); }
  .toggle input:checked::after { transform: translateX(16px); background: var(--coin); }
  .abrir svg { transition: transform .25s var(--ease); }
  .reuniao.aberta .abrir svg { transform: rotate(180deg); }
  .r-corpo { display: none; padding: 4px 12px 14px 62px; gap: 12px; }
  .reuniao.aberta .r-corpo { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .r-pe { grid-column: 1 / -1; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .remover { color: var(--danger); background: none; border: 0; font: 600 13.5px var(--body); cursor: pointer; padding: 4px 0; }
  .acoes-link { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 16px; align-items: center; }
  button.link { background: none; border: 0; padding: 0 0 2px; cursor: pointer; font: 600 14px var(--body); color: var(--ink); border-bottom: 1.5px solid var(--coin); }

  /* Barra de salvar, modais e avisos */
  .barra { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: color-mix(in srgb, var(--card) 94%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .barra .wrap { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-block: 12px; }
  .barra .info { font-size: 14px; color: var(--ink-soft); }
  .barra .info.mudou { color: var(--gold); font-weight: 600; }
  .modal { position: fixed; inset: 0; z-index: 50; background: rgba(27,31,39,.45); display: grid; place-items: center; padding: 16px; animation: fade .2s both; }
  .modal-card { width: min(100%, 560px); max-height: calc(100vh - 32px); overflow: auto; background: var(--card); border-radius: 24px; padding: 28px 26px; display: grid; gap: 16px; box-shadow: 0 30px 60px -20px rgba(27,31,39,.5); }
  .modal-card h2 { font-size: 26px; }
  .modal-acoes { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
  .marca { display: flex; gap: 10px; align-items: start; font-size: 14px; }
  .marca input { margin-top: 3px; accent-color: var(--night); }
  @keyframes fade { from { opacity: 0; } }
  .toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); z-index: 60; background: var(--night); color: var(--on-night); padding: 12px 20px; border-radius: 999px; font-size: 14.5px; box-shadow: 0 14px 30px -12px rgba(27,31,39,.6); animation: fade .2s both; max-width: calc(100vw - 32px); text-align: center; }

  /* Agenda */
  .agenda-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  .agenda-grid > div { min-width: 0; }
  .gframe { width: 100%; height: 640px; border: 0; border-radius: 16px; background: #fff; display: block; }
  .modos { display: flex; gap: 6px; }
  .modos button { font: 600 13px var(--body); padding: 7px 12px; border-radius: 999px; border: 1.5px solid var(--line); background: transparent; color: var(--ink-soft); cursor: pointer; }
  .modos button.on { background: var(--night); color: var(--on-night); border-color: var(--night); }
  .sem-agenda { border: 1.5px dashed var(--line); border-radius: 18px; padding: 36px 22px; text-align: center; display: grid; gap: 10px; justify-items: center; }
  .sem-agenda h3 { font-size: 22px; }
  .sem-agenda p { color: var(--ink-soft); max-width: 44ch; font-size: 14.5px; }

  @media (max-width: 1000px) {
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .duas, .lead-grid, .agenda-grid { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 720px) {
    .grade, .grade.tres { grid-template-columns: minmax(0, 1fr); }
    .kpi { padding: 14px 16px; }
    .r-cab { grid-template-columns: 38px minmax(0, 1fr) minmax(0, 1fr) auto; }
    .r-cab .r-tema { grid-column: 1 / -1; grid-row: 3; }
    .r-cab .toggle { grid-column: 1 / 4; grid-row: 2; }
    .r-cab .abrir { grid-column: 4; grid-row: 2; }

    .reuniao.aberta .r-corpo { grid-template-columns: minmax(0, 1fr); }
    .gframe { height: 520px; }
    .barra-l { grid-template-columns: 110px minmax(0, 1fr) 24px; }
  }
</style>
</head>
<body>
<div id="avisoDemo"></div>
<header class="topo">
  <div class="wrap">
    <a href="#inicio"><img class="logo" src="logo.png" alt="Yale Barbosa, planejadora financeira"></a>
    <nav class="nav" id="nav" hidden>
      <a href="#inicio" data-v="inicio">Início</a>
      <a href="#agenda" data-v="agenda">Agenda</a>
      <a href="#funil" data-v="funil">Funil</a>
      <a href="#clientes" data-v="clientes">Clientes</a>
    </nav>
    <div class="topo-dir" id="topoDir"></div>
  </div>
</header>
<main class="wrap" id="app"><p class="suave">Carregando…</p></main>
<div id="camada"></div>
<div id="modal"></div>

<script src="config.js"></script>
<script src="comum.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function () {
  const cfg = window.JORNADA_CONFIG || {};
  const DEMO = new URLSearchParams(location.search).has('demo') || !cfg.SUPABASE_URL || !cfg.SUPABASE_ANON_KEY || !window.supabase;
  const $ = function (id) { return document.getElementById(id); };
  const app = $('app'), camada = $('camada'), modalEl = $('modal');
  const IC = {
    mais: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    voltar: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
    seta: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
    copiar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>',
    zap: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1.3-3.9A8 8 0 1 1 8 19z"/></svg>',
    olho: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
    cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18M12 14v4M10 16h4"/></svg>',
    eng: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
    sair: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>'
  };
  const S = { leads: [], clientes: [], config: {} };

  function uuid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16); });
  }
  function toast(msg) {
    const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; t.setAttribute('role', 'status');
    document.body.appendChild(t); setTimeout(function () { t.remove(); }, 2800);
  }
  function semAcento(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
  function linkDoCliente(token) { return location.href.split('#')[0].split('?')[0].replace(/[^/]*$/, '') + 'cliente.html?c=' + token; }
  function numero(v) { if (v === '' || v == null) return null; const n = Number(String(v).replace(/\./g, '').replace(',', '.')); return isNaN(n) ? null : n; }
  function ordenarReunioes(c) { c.reunioes = (c.reunioes || []).slice().sort(function (a, b) { return a.ordem - b.ordem; }); return c; }

  // ==========================================================
  // Dados: Supabase ou demonstração
  // ==========================================================
  let api;
  if (DEMO) {
    $('avisoDemo').innerHTML = '<div class="aviso"><div class="wrap"><b>Modo demonstração.</b> Dados de exemplo, guardados só neste navegador.</div></div>';
    const CH = 'painel-yale-demo-v2';
    let mem = null;
    const ler = function () {
      if (mem) return mem;
      try { mem = JSON.parse(localStorage.getItem(CH)); } catch (e) { mem = null; }
      if (!mem || !mem.leads) mem = semente();
      return mem;
    };
    const gravar = function () { try { localStorage.setItem(CH, JSON.stringify(mem)); } catch (e) {} };
    const copia = function (x) { return JSON.parse(JSON.stringify(x)); };
    function semente() {
      const hoje = J.hojeISO();
      const d = function (n) { const x = J.parseData(hoje); x.setDate(x.getDate() + n); return J.iso(x); };
      const ts = function (n, h) { const x = J.parseData(d(n)); x.setHours(h, 0, 0, 0); return x.toISOString(); };
      const agora = new Date().toISOString();
      const clientes = [];
      function cli(nome, prof, inicioOff, feitas, valor, extra) {
        const id = uuid(); const ini = d(inicioOff);
        clientes.push(Object.assign({ id: id, token: uuid(), nome: nome, profissao: prof, email: '', whatsapp: '', inicio: ini, valor_mensal: valor, situacao: 'ativo', ativo: true, observacoes: '', como_iniciamos: '', onde_estamos: '', para_onde_vamos: '', updated_at: agora,
          reunioes: J.TEMAS_PADRAO.map(function (t, i) { return { id: uuid(), ordem: i + 1, data: J.addMeses(ini, i), hora: '10:00', tema: t, realizada: i < feitas, resumo: i < feitas ? 'Resumo do encontro ' + (i + 1) + '.' : '', combinados: '' }; }) }, extra || {}));
        return id;
      }
      const c1 = cli('Mariana Albuquerque', 'Advogada', -95, 3, 597, {
        como_iniciamos: 'Renda familiar de cerca de R$ 22 mil por mês, mas sem saber para onde ia cada parte dela.\n\n- Investimentos espalhados em três bancos\n- Nenhuma reserva para imprevistos',
        onde_estamos: 'Orçamento organizado e investimento automático todo mês.', para_onde_vamos: 'Reserva completa e proteção da família estruturada até o fim do ciclo.' });
      cli('Dra. Renata Figueiredo', 'Médica', -35, 1, 697);
      cli('Paulo e Lívia Sampaio', 'Casal empresário', -150, 5, 797);
      const L = function (o) { return Object.assign({ id: uuid(), whatsapp: '(81) 9' + Math.floor(10000000 + Math.random() * 89999999), email: '', origem: 'Formulário de diagnóstico', profissao: 'Advogada', renda_faixa: 'R$ 15 a 20 mil', momento: 'Fazer o patrimônio crescer', quando_comecar: 'Nas próximas semanas', motivo: '', etapa: 'novo', etapa_desde: agora, diagnostico_em: null, proximo_passo: '', proximo_passo_data: null, valor_proposta: null, motivo_perda: '', cliente_id: null, created_at: agora, updated_at: agora }, o); };
      const leads = [
        L({ nome: 'Camila Rocha', origem: 'Página das advogadas', renda_faixa: 'Acima de R$ 20 mil', quando_comecar: 'O quanto antes' }),
        L({ nome: 'Juliana Prado', profissao: 'Médica', origem: 'Instagram', renda_faixa: 'R$ 10 a 15 mil', momento: 'Organizar as contas', created_at: ts(-3, 9) }),
        L({ nome: 'Beatriz Nogueira', etapa: 'contato', motivo: 'Acabou de sair de um escritório grande e abriu o próprio. Renda subiu, mas não sabe quanto pode retirar por mês.', proximo_passo: 'Enviar link do formulário', proximo_passo_data: d(-1) }),
        L({ nome: 'Fernanda Lins', profissao: 'Médica', origem: 'Indicação', etapa: 'contato', proximo_passo: 'Ligar para marcar o diagnóstico', proximo_passo_data: d(1) }),
        L({ nome: 'Aline Barros', etapa: 'diagnostico', diagnostico_em: ts(2, 15), motivo: 'Casamento em 2027 e quer comprar o primeiro imóvel.' }),
        L({ nome: 'Tatiana Mello', etapa: 'proposta', valor_proposta: 597, proximo_passo: 'Retomar sobre a proposta', proximo_passo_data: d(0) }),
        L({ nome: 'Larissa Costa', profissao: 'Médica', etapa: 'followup', valor_proposta: 697, proximo_passo: 'Mensagem de follow-up', proximo_passo_data: d(4) }),
        L({ nome: 'Mariana Albuquerque', etapa: 'fechado', cliente_id: c1, valor_proposta: 597 }),
        L({ nome: 'Patrícia Gomes', etapa: 'perdido', motivo_perda: 'Preferiu adiar para o ano que vem' })
      ];
      const atividades = [
        { id: uuid(), lead_id: leads[2].id, tipo: 'whatsapp', texto: 'Primeiro contato. Respondeu rápido e quer entender quanto pode retirar do escritório.', criado_em: ts(-2, 11) },
        { id: uuid(), lead_id: leads[5].id, tipo: 'reuniao', texto: 'Diagnóstico feito. Foco em aposentadoria e proteção.', criado_em: ts(-6, 14) },
        { id: uuid(), lead_id: leads[5].id, tipo: 'email', texto: 'Proposta enviada.', criado_em: ts(-5, 10) }
      ];
      return { leads: leads, clientes: clientes, atividades: atividades, config: { google_agenda: '', whatsapp: '' } };
    }
    api = {
      async sessao() { return { email: 'demonstração' }; },
      async entrar() { return null; },
      async sair() {},
      async carregar() { const m = ler(); S.leads = copia(m.leads); S.clientes = copia(m.clientes).map(ordenarReunioes); S.config = copia(m.config || {}); },
      async criarLead(l) { const n = Object.assign({ id: uuid(), etapa: 'novo', etapa_desde: new Date().toISOString(), created_at: new Date().toISOString() }, l); ler().leads.push(n); gravar(); return n.id; },
      async atualizarLead(id, campos) { const l = ler().leads.find(function (x) { return x.id === id; }); if (campos.etapa && campos.etapa !== l.etapa) campos.etapa_desde = new Date().toISOString(); Object.assign(l, campos, { updated_at: new Date().toISOString() }); gravar(); },
      async excluirLead(id) { ler(); mem.leads = mem.leads.filter(function (x) { return x.id !== id; }); mem.atividades = mem.atividades.filter(function (a) { return a.lead_id !== id; }); gravar(); },
      async atividades(leadId) { return copia(ler().atividades.filter(function (a) { return a.lead_id === leadId; })).sort(function (a, b) { return b.criado_em.localeCompare(a.criado_em); }); },
      async addAtividade(a) { ler().atividades.push(Object.assign({ id: uuid(), criado_em: new Date().toISOString() }, a)); gravar(); },
      async excluirAtividade(id) { ler(); mem.atividades = mem.atividades.filter(function (a) { return a.id !== id; }); gravar(); },
      async criarCliente(c, rs) { const n = Object.assign({ id: uuid(), token: uuid(), ativo: true, situacao: 'ativo', updated_at: new Date().toISOString() }, c, { reunioes: rs.map(function (r) { return Object.assign({ id: uuid() }, r); }) }); ler().clientes.push(n); gravar(); return n.id; },
      async salvarCliente(c, rs) { const lista = ler().clientes; const i = lista.findIndex(function (x) { return x.id === c.id; }); lista[i] = Object.assign({}, lista[i], c, { reunioes: rs, updated_at: new Date().toISOString() }); gravar(); },
      async excluirCliente(id) { ler(); mem.clientes = mem.clientes.filter(function (x) { return x.id !== id; }); mem.leads.forEach(function (l) { if (l.cliente_id === id) l.cliente_id = null; }); gravar(); },
      async novoToken(id) { const c = ler().clientes.find(function (x) { return x.id === id; }); c.token = uuid(); gravar(); return c.token; },
      async salvarConfig(c) { ler().config = Object.assign({}, c); gravar(); }
    };
  } else {
    const sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
    const ok = function (r) { if (r.error) throw r.error; return r.data; };
    const vazioNulo = function (o) { const x = {}; Object.keys(o).forEach(function (k) { x[k] = o[k] === '' ? null : o[k]; }); return x; };
    const CAMPOS_LEAD = ['nome', 'whatsapp', 'email', 'origem', 'profissao', 'renda_faixa', 'momento', 'quando_comecar', 'motivo', 'etapa', 'diagnostico_em', 'proximo_passo', 'proximo_passo_data', 'valor_proposta', 'motivo_perda', 'cliente_id'];
    const CAMPOS_CLI = ['nome', 'email', 'whatsapp', 'profissao', 'inicio', 'valor_mensal', 'situacao', 'observacoes', 'como_iniciamos', 'onde_estamos', 'para_onde_vamos', 'ativo'];
    const filtra = function (o, campos) { const x = {}; campos.forEach(function (k) { if (k in o) x[k] = o[k]; }); return vazioNulo(x); };
    const reu = function (r, cid) { return { id: r.id, cliente_id: cid, ordem: r.ordem, data: r.data || null, hora: r.hora || null, tema: r.tema || null, realizada: !!r.realizada, resumo: r.resumo || null, combinados: r.combinados || null }; };
    let uid = null;
    api = {
      async sessao() { const s = (await sb.auth.getSession()).data.session; uid = s ? s.user.id : null; return s ? { email: s.user.email } : null; },
      async entrar(email, senha) { const r = await sb.auth.signInWithPassword({ email: email, password: senha }); return r.error ? 'E-mail ou senha incorretos.' : null; },
      async sair() { await sb.auth.signOut(); },
      async carregar() {
        const res = await Promise.all([
          sb.from('leads').select('*').order('created_at', { ascending: false }),
          sb.from('clientes').select('*, reunioes(*)').order('nome'),
          sb.from('configuracoes').select('*').maybeSingle()
        ]);
        S.leads = ok(res[0]) || []; S.clientes = (ok(res[1]) || []).map(ordenarReunioes); S.config = ok(res[2]) || {};
      },
      async criarLead(l) { return ok(await sb.from('leads').insert(filtra(l, CAMPOS_LEAD)).select('id').single()).id; },
      async atualizarLead(id, campos) { ok(await sb.from('leads').update(filtra(campos, CAMPOS_LEAD)).eq('id', id)); },
      async excluirLead(id) { ok(await sb.from('leads').delete().eq('id', id)); },
      async atividades(leadId) { return ok(await sb.from('atividades').select('*').eq('lead_id', leadId).order('criado_em', { ascending: false })) || []; },
      async addAtividade(a) { ok(await sb.from('atividades').insert({ lead_id: a.lead_id, tipo: a.tipo, texto: a.texto })); },
      async excluirAtividade(id) { ok(await sb.from('atividades').delete().eq('id', id)); },
      async criarCliente(c, rs) {
        const n = ok(await sb.from('clientes').insert(filtra(c, CAMPOS_CLI)).select('id').single());
        if (rs.length) ok(await sb.from('reunioes').insert(rs.map(function (r) { return reu(Object.assign({ id: uuid() }, r), n.id); })));
        return n.id;
      },
      async salvarCliente(c, rs, removidos) {
        ok(await sb.from('clientes').update(filtra(c, CAMPOS_CLI)).eq('id', c.id));
        if (removidos && removidos.length) ok(await sb.from('reunioes').delete().in('id', removidos));
        if (rs.length) ok(await sb.from('reunioes').upsert(rs.map(function (r) { return reu(r, c.id); })));
      },
      async excluirCliente(id) { ok(await sb.from('clientes').delete().eq('id', id)); },
      async novoToken(id) { const t = uuid(); ok(await sb.from('clientes').update({ token: t }).eq('id', id)); return t; },
      async salvarConfig(c) { ok(await sb.from('configuracoes').upsert(vazioNulo({ owner_id: uid, google_agenda: c.google_agenda || '', whatsapp: c.whatsapp || '' }))); }
    };
  }

  // ==========================================================
  // Navegação
  // ==========================================================
  let mudou = false;
  let hashAtual = '';
  window.addEventListener('beforeunload', function (e) { if (mudou) { e.preventDefault(); e.returnValue = ''; } });

  async function iniciar() {
    const s = await api.sessao().catch(function () { return null; });
    if (!s) return telaLogin();
    $('nav').hidden = false;
    $('topoDir').innerHTML = '<button class="icone" id="bConfig" title="Configurações" aria-label="Configurações">' + IC.eng + '</button>' +
      (DEMO ? '' : '<button class="icone" id="bSair" title="Sair" aria-label="Sair">' + IC.sair + '</button>');
    $('bConfig').onclick = modalConfig;
    if ($('bSair')) $('bSair').onclick = async function () { await api.sair(); location.hash = ''; location.reload(); };
    try { await api.carregar(); }
    catch (e) { app.innerHTML = '<p class="erro">Não foi possível carregar os dados: ' + J.esc(e.message || e) + '</p>'; return; }
    window.addEventListener('hashchange', rota);
    rota();
  }

  function rota() {
    const h = location.hash.replace(/^#/, '') || 'inicio';
    if (mudou && h !== hashAtual) {
      if (!confirm('Há alterações não salvas. Sair mesmo assim?')) { history.replaceState(null, '', '#' + hashAtual); return; }
      mudou = false;
    }
    hashAtual = h;
    app.classList.toggle('largo', h === 'funil');
    document.querySelector('.topo .wrap').classList.toggle('largo', h === 'funil');
    camada.innerHTML = ''; modalEl.innerHTML = '';
    let v = h;
    if (h.indexOf('lead-') === 0) v = 'funil';
    if (h.indexOf('cliente-') === 0) v = 'clientes';
    document.querySelectorAll('#nav a').forEach(function (a) { a.classList.toggle('on', a.dataset.v === v); });
    atualizarBadge();
    window.scrollTo(0, 0);
    if (h.indexOf('lead-') === 0) return telaLead(h.slice(5));
    if (h.indexOf('cliente-') === 0) return telaCliente(h.slice(8));
    if (h === 'agenda') return telaAgenda();
    if (h === 'funil') return telaFunil();
    if (h === 'clientes') return telaClientes();
    return telaInicio();
  }
  function ir(h) { if (location.hash === '#' + h) rota(); else location.hash = '#' + h; }

  function atualizarBadge() {
    const n = S.leads.filter(function (l) { return l.etapa === 'novo'; }).length;
    const a = document.querySelector('#nav a[data-v=funil]');
    if (a) a.innerHTML = 'Funil' + (n ? '<span class="qt">' + n + '</span>' : '');
  }

  function telaLogin() {
    app.innerHTML = '<div class="login"><form class="login-card" id="fLogin">' +
      '<div class="eyebrow">Área da planejadora</div><h1>Seu painel</h1>' +
      '<label class="campo">E-mail<input type="email" name="email" autocomplete="username" required></label>' +
      '<label class="campo">Senha<input type="password" name="senha" autocomplete="current-password" required></label>' +
      '<div class="erro" id="erro" role="alert"></div>' +
      '<button class="btn" type="submit">Entrar <span aria-hidden="true">→</span></button></form></div>';
    $('fLogin').onsubmit = async function (e) {
      e.preventDefault();
      const f = e.target, b = f.querySelector('button'); b.disabled = true;
      const erro = await api.entrar(f.email.value.trim(), f.senha.value);
      if (erro) { $('erro').textContent = erro; b.disabled = false; return; }
      location.reload();
    };
  }

  // ==========================================================
  // Compromissos (agenda do painel)
  // ==========================================================
  function compromissos() {
    const out = [];
    S.clientes.forEach(function (c) {
      if (c.situacao === 'encerrado') return;
      c.reunioes.forEach(function (r, i) {
        if (r.realizada || !r.data) return;
        out.push({ tipo: 'encontro', rotulo: 'Encontro', data: r.data, hora: r.hora || '', titulo: c.nome, sub: 'Encontro ' + (i + 1) + (r.tema ? ' · ' + r.tema : ''), href: '#cliente-' + c.id,
          google: J.linkGoogle('Planejamento · ' + c.nome + ' (encontro ' + (i + 1) + ')', r.data, r.hora, 90, r.tema || '') });
      });
    });
    S.leads.forEach(function (l) {
      if (J.ETAPAS_ABERTAS.indexOf(l.etapa) < 0) return;
      if (l.diagnostico_em) {
        const p = J.partesTs(l.diagnostico_em);
        out.push({ tipo: 'diagnostico', rotulo: 'Diagnóstico', data: p.data, hora: p.hora, titulo: l.nome, sub: 'Reunião de diagnóstico', href: '#lead-' + l.id,
          google: J.linkGoogle('Diagnóstico · ' + l.nome, p.data, p.hora, 60, l.motivo || '') });
      }
      if (l.proximo_passo_data) {
        out.push({ tipo: 'followup', rotulo: 'Follow-up', data: l.proximo_passo_data, hora: '', titulo: l.nome, sub: l.proximo_passo || 'Retomar contato', href: '#lead-' + l.id,

      const rs = atual.reunioes, ult = rs[rs.length - 1];
      rs.push({ id: uuid(), ordem: rs.length + 1, data: ult && ult.data ? J.addMeses(ult.data, 1) : J.hojeISO(), hora: ult ? ult.hora : '10:00', tema: J.TEMAS_PADRAO[rs.length] || 'Acompanhamento', realizada: false, resumo: '', combinados: '', _aberta: true });
      marcarMudanca(); pintarReunioes();
    };
    $('salvar').onclick = salvarCliente;
    const cp = $('copiar');
    if (cp) cp.onclick = function () {
      const campo = $('campoLink');
      (navigator.clipboard ? navigator.clipboard.writeText(campo.value) : Promise.reject()).then(function () { toast('Link copiado.'); })
        .catch(function () { campo.select(); try { document.execCommand('copy'); toast('Link copiado.'); } catch (e) { toast('Selecione o link e copie.'); } });
    };
    $('novoLink').onclick = async function () {
      if (!confirm('Gerar um novo link? O antigo para de funcionar e você precisará enviar o novo ao cliente.')) return;
      try { atual.token = await api.novoToken(atual.id); await api.carregar(); pintarCliente(); toast('Novo link gerado.'); } catch (e) { toast('Erro: ' + (e.message || e)); }
    };
    $('excluir').onclick = async function () {
      if (!confirm('Excluir ' + atual.nome + ' e todos os encontros? Isso não pode ser desfeito.')) return;
      try { await api.excluirCliente(atual.id); await api.carregar(); mudou = false; toast('Cliente excluído.'); ir('clientes'); } catch (e) { toast('Erro: ' + (e.message || e)); }
    };
  }
  function pintarReunioes() {
    const alvo = $('reunioes'); const rs = atual.reunioes;
    if (!rs.length) { alvo.innerHTML = '<p class="vazio">Nenhum encontro ainda.</p>'; return; }
    alvo.innerHTML = rs.map(function (r, i) {
      const g = J.linkGoogle('Planejamento · ' + atual.nome + ' (encontro ' + (i + 1) + ')', r.data, r.hora, 90, r.tema || '');
      return '<div class="reuniao' + (r.realizada ? ' feita' : '') + (r._aberta ? ' aberta' : '') + '" data-i="' + i + '"><div class="r-cab">' +
        '<div class="r-num">' + J.num2(i + 1) + '</div>' +
        '<input type="date" data-r="data" value="' + J.esc(r.data || '') + '" aria-label="Data do encontro ' + (i + 1) + '">' +
        '<input type="time" data-r="hora" value="' + J.esc(r.hora || '') + '" aria-label="Horário do encontro ' + (i + 1) + '">' +
        '<input type="text" class="r-tema" data-r="tema" value="' + J.esc(r.tema || '') + '" placeholder="Tema do encontro" aria-label="Tema do encontro ' + (i + 1) + '">' +
        '<label class="toggle"><input type="checkbox" data-r="realizada"' + (r.realizada ? ' checked' : '') + '> Realizado</label>' +
        '<button class="icone abrir" type="button" aria-label="Detalhes do encontro ' + (i + 1) + '" aria-expanded="' + (r._aberta ? 'true' : 'false') + '">' + IC.seta + '</button></div>' +
        '<div class="r-corpo">' +
          '<label class="campo">O que decidimos<textarea data-r="resumo" rows="4">' + J.esc(r.resumo || '') + '</textarea></label>' +
          '<label class="campo">Combinados até o próximo encontro <small>(um por linha)</small><textarea data-r="combinados" rows="4">' + J.esc(r.combinados || '') + '</textarea></label>' +
          '<div class="r-pe">' + (g && !r.realizada ? '<a class="gbtn" href="' + g + '" target="_blank" rel="noopener">' + IC.cal + 'Pôr na Agenda do Google</a>' : '') + '<button class="remover" type="button">Remover este encontro</button></div>' +
        '</div></div>';
    }).join('');
    alvo.querySelectorAll('.reuniao').forEach(function (el) {
      const i = Number(el.dataset.i), r = atual.reunioes[i];
      el.querySelectorAll('[data-r]').forEach(function (inp) {
        inp.addEventListener(inp.type === 'checkbox' ? 'change' : 'input', function () {
          r[inp.dataset.r] = inp.type === 'checkbox' ? inp.checked : inp.value;
          if (inp.type === 'checkbox') { el.classList.toggle('feita', inp.checked); if (inp.checked && !r._aberta) { r._aberta = true; el.classList.add('aberta'); el.querySelector('[data-r=resumo]').focus(); } }
          marcarMudanca();
        });
      });
      el.querySelector('.abrir').onclick = function () { r._aberta = !r._aberta; el.classList.toggle('aberta', r._aberta); this.setAttribute('aria-expanded', r._aberta ? 'true' : 'false'); };
      el.querySelector('.remover').onclick = function () {
        if (!confirm('Remover o encontro ' + (i + 1) + '?')) return;
        atual.reunioes.splice(i, 1); if (r.id) removidos.push(r.id);
        atual.reunioes.forEach(function (x, k) { x.ordem = k + 1; }); marcarMudanca(); pintarReunioes();
      };
    });
  }
  async function salvarCliente() {
    const b = $('salvar');
    if (!atual.nome || !atual.nome.trim()) return toast('Preencha o nome do cliente.');
    b.disabled = true; b.textContent = 'Salvando…';
    atual.reunioes.forEach(function (r, k) { r.ordem = k + 1; if (!r.id) r.id = uuid(); });
    atual.inicio = (atual.reunioes[0] && atual.reunioes[0].data) || atual.inicio || null;
    const limpas = atual.reunioes.map(function (r) { return { id: r.id, ordem: r.ordem, data: r.data || null, hora: r.hora || null, tema: r.tema, realizada: !!r.realizada, resumo: r.resumo || '', combinados: r.combinados || '' }; });
    const dados = Object.assign({}, atual, { valor_mensal: numero(atual.valor_mensal) });
    delete dados.reunioes;
    try {
      await api.salvarCliente(dados, limpas, removidos);
      await api.carregar(); removidos = []; mudou = false;
      toast('Alterações salvas. O cliente já vê a versão nova.');
      telaCliente(atual.id);
    } catch (e) { toast('Não foi possível salvar: ' + (e.message || e)); b.disabled = false; b.textContent = 'Salvar alterações'; }
  }

  // ==========================================================
  // Configurações
  // ==========================================================
  function modalConfig() {
    const c = S.config || {};
    modalEl.innerHTML = '<div class="modal"><form class="modal-card" id="fCfg"><div><div class="eyebrow">Painel</div><h2 style="margin-top:10px">Configurações</h2></div>' +
      '<label class="campo">E-mail da sua Agenda do Google <small>(o Gmail onde ficam as suas reuniões)</small><input type="email" name="google_agenda" value="' + J.esc(c.google_agenda || '') + '" placeholder="voce@gmail.com"></label>' +
      '<label class="campo">WhatsApp de atendimento <small>(aparece como botão na página do cliente)</small><input type="tel" name="whatsapp" value="' + J.esc(c.whatsapp || '') + '" placeholder="5581999999999"></label>' +
      '<p class="suave pequeno">A agenda só aparece no painel quando você está conectada à sua conta Google neste navegador. Ela não fica visível para mais ninguém.</p>' +
      '<div class="modal-acoes"><button type="button" class="btn ghost" data-fechar>Cancelar</button><button class="btn" type="submit">Salvar</button></div></form></div>';
    ligarModal();
    $('fCfg').onsubmit = async function (e) {
      e.preventDefault(); const f = e.target;
      try {
        await api.salvarConfig({ google_agenda: f.google_agenda.value.trim(), whatsapp: f.whatsapp.value.replace(/\D/g, '') });
        await api.carregar(); modalEl.innerHTML = ''; toast('Configurações salvas.');
        if ((location.hash || '#inicio') === '#agenda') rota();
      } catch (err) { toast('Erro: ' + (err.message || err)); }
    };
  }

  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && modalEl.innerHTML) modalEl.innerHTML = ''; });
  iniciar();
})();
</script>
</body>
</html>
