<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Painel de clientes | Yale Barbosa</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;1,400;1,500&display=swap">
<link rel="stylesheet" href="estilo.css">
<style>
  main { padding-block: 32px 120px; }
  .aviso { background: var(--night); color: var(--on-night); font-size: 14px; padding: 10px 0; }
  .aviso b { color: var(--coin); }
  .topo-acoes { display: flex; align-items: center; gap: 12px; font-size: 14px; color: var(--ink-soft); }

  h1 { font-size: clamp(30px, 4vw, 42px); line-height: 1.12; }
  .cab { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 18px; margin-bottom: 28px; }
  .cab p { color: var(--ink-soft); margin-top: 6px; }

  /* Campos */
  label.campo { display: grid; gap: 6px; font-size: 13.5px; font-weight: 600; color: var(--ink); min-width: 0; }
  label.campo small { font-weight: 400; color: var(--ink-soft); }
  input[type=text], input[type=email], input[type=password], input[type=date], input[type=tel], input[type=number], input[type=search], select, textarea {
    width: 100%; min-width: 0; font: 400 15.5px/1.45 var(--body); color: var(--ink); background: #fff; border: 1.5px solid var(--line); border-radius: 12px; padding: 11px 13px; transition: border-color .2s, box-shadow .2s; }
  textarea { resize: vertical; min-height: 92px; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--coin); box-shadow: 0 0 0 3px color-mix(in srgb, var(--coin) 30%, transparent); }
  .grade { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .grade.tres { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .cheio { grid-column: 1 / -1; }

  /* Login */
  .login { min-height: calc(100vh - 140px); display: grid; place-items: center; }
  .login-card { width: min(100%, 420px); background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 34px 30px; display: grid; gap: 18px; }
  .login-card h1 { font-size: 30px; }
  .erro { color: var(--danger); font-size: 14px; }

  /* Lista */
  .busca { width: min(100%, 320px); }
  .lista { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .cli { min-width: 0; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 22px 22px 20px; cursor: pointer; font: inherit; color: inherit; display: grid; gap: 14px; transition: transform .3s var(--ease), box-shadow .3s var(--ease), border-color .3s; }
  .cli:hover { transform: translateY(-3px); box-shadow: 0 20px 36px -26px rgba(27,31,39,.45); border-color: var(--coin); }
  .cli h3 { font-size: 21px; line-height: 1.25; overflow-wrap: anywhere; }
  .cli .meta { font-size: 13.5px; color: var(--ink-soft); }
  .mini { display: flex; gap: 6px; align-items: center; }
  .mini span { flex: 1; height: 6px; border-radius: 999px; background: var(--line); }
  .mini span.f { background: var(--coin); }
  .mini span.a { background: var(--night); }
  .cli-rodape { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13.5px; }
  .status { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: color-mix(in srgb, var(--coin) 25%, var(--card)); }
  .status.off { background: var(--paper-2); color: var(--ink-soft); }
  .vazio-lista { background: var(--card); border: 1.5px dashed var(--line); border-radius: 22px; padding: 48px 24px; text-align: center; color: var(--ink-soft); }
  .vazio-lista h3 { color: var(--ink); font-size: 24px; margin-bottom: 8px; }

  /* Painel lateral / modal */
  .modal { position: fixed; inset: 0; z-index: 50; background: rgba(27,31,39,.45); display: grid; place-items: center; padding: 16px; animation: fade .2s both; }
  .modal-card { width: min(100%, 560px); max-height: calc(100vh - 32px); overflow: auto; background: var(--card); border-radius: 24px; padding: 30px 28px; display: grid; gap: 18px; box-shadow: 0 30px 60px -20px rgba(27,31,39,.5); }
  .modal-card h2 { font-size: 28px; }
  .modal-acoes { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
  @keyframes fade { from { opacity: 0; } }

  /* Editor */
  .voltar { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-soft); font: 600 14px var(--body); background: none; border: 0; padding: 0; cursor: pointer; margin-bottom: 18px; }
  .voltar:hover { color: var(--ink); }
  .bloco { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: clamp(20px, 3vw, 30px); margin-top: 18px; }
  .bloco > h2 { font-size: 24px; }
  .bloco > .sub { color: var(--ink-soft); font-size: 14.5px; margin-top: 4px; margin-bottom: 20px; }
  .link-box { background: var(--night); color: var(--on-night); border-radius: 22px; padding: 22px 24px; display: grid; gap: 14px; margin-top: 22px; }
  .link-box .r { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .link-box input { flex: 1 1 260px; background: var(--night-2); border-color: var(--night-2); color: var(--on-night); font-size: 14px; }
  .link-box .lbl { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; color: var(--coin); }
  .link-box .btn.ghost { color: var(--on-night); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--on-night-soft) 45%, transparent); }
  .link-box .btn.ghost::before { background: var(--night-2); }
  .link-box .btn.ghost:hover { color: var(--on-night); }
  .link-off { color: var(--coin); font-size: 14px; }

  .reuniao { border: 1px solid var(--line); border-radius: 18px; background: #fff; margin-top: 12px; overflow: hidden; }
  .reuniao.feita { border-color: color-mix(in srgb, var(--coin) 70%, var(--line)); }
  .r-cab { display: grid; grid-template-columns: 44px minmax(0, 150px) minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 12px 14px; }
  .r-num { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--line); font: italic 500 16px/1 var(--display); color: var(--ink-soft); }
  .reuniao.feita .r-num { background: var(--coin); border-color: var(--coin); color: var(--night); }
  .toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; cursor: pointer; white-space: nowrap; user-select: none; }
  .toggle input { appearance: none; -webkit-appearance: none; width: 40px; height: 24px; border-radius: 999px; background: var(--line); position: relative; cursor: pointer; transition: background .2s; margin: 0; flex: none; }
  .toggle input::after { content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .2s var(--ease); box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .toggle input:checked { background: var(--night); }
  .toggle input:checked::after { transform: translateX(16px); background: var(--coin); }
  .icone { width: 38px; height: 38px; border-radius: 10px; border: 0; background: transparent; color: var(--ink-soft); display: grid; place-items: center; cursor: pointer; }
  .icone:hover { background: var(--paper-2); color: var(--ink); }
  .icone svg { width: 18px; height: 18px; transition: transform .25s var(--ease); }
  .reuniao.aberta .abrir svg { transform: rotate(180deg); }
  .r-corpo { display: none; padding: 4px 14px 16px 70px; gap: 14px; }
  .reuniao.aberta .r-corpo { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .r-corpo .remover { grid-column: 1 / -1; justify-self: start; color: var(--danger); background: none; border: 0; font: 600 13.5px var(--body); cursor: pointer; padding: 4px 0; }
  .add { margin-top: 14px; }

  .barra { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: color-mix(in srgb, var(--card) 94%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .barra .wrap { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-block: 12px; }
  .barra .info { font-size: 14px; color: var(--ink-soft); }
  .barra .info.mudou { color: var(--gold); font-weight: 600; }
  .perigo { color: var(--danger); background: none; border: 0; font: 600 14px var(--body); cursor: pointer; padding: 6px 0; }
  .acoes-link { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 16px; align-items: center; }
  .acoes-link button.link { background: none; border: 0; padding: 0 0 2px; cursor: pointer; font: 600 14px var(--body); color: var(--ink); border-bottom: 1.5px solid var(--coin); }

  .toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); z-index: 60; background: var(--night); color: var(--on-night); padding: 12px 20px; border-radius: 999px; font-size: 14.5px; box-shadow: 0 14px 30px -12px rgba(27,31,39,.6); animation: fade .2s both; max-width: calc(100vw - 32px); }

  @media (max-width: 720px) {
    .grade, .grade.tres { grid-template-columns: minmax(0, 1fr); }
    .r-cab { grid-template-columns: 40px minmax(0, 1fr) auto; }
    .r-cab .r-data { grid-column: 2 / 3; }
    .r-cab .r-tema { grid-column: 1 / -1; }
    .r-cab .toggle { grid-column: 2 / 3; grid-row: 1; justify-self: end; }
    .r-cab .abrir { grid-column: 3; grid-row: 1; }
    .r-cab .r-num { grid-row: 1; }
    .r-cab .r-data { grid-row: 2; grid-column: 1 / -1; }
    .r-corpo { padding-left: 14px; }
    .reuniao.aberta .r-corpo { grid-template-columns: minmax(0, 1fr); }
    .barra .perigo { display: none; }
  }
</style>
</head>
<body>
<div id="avisoDemo"></div>
<header class="topo">
  <div class="wrap">
    <img class="logo" src="logo.png" alt="Yale Barbosa, planejadora financeira">
    <div class="topo-acoes" id="topoAcoes"></div>
  </div>
</header>
<main class="wrap" id="app"></main>
<div id="camada"></div>

<script src="config.js"></script>
<script src="comum.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function () {
  const cfg = window.JORNADA_CONFIG || {};
  const DEMO = new URLSearchParams(location.search).has('demo') || !cfg.SUPABASE_URL || !cfg.SUPABASE_ANON_KEY;
  const app = document.getElementById('app');
  const camada = document.getElementById('camada');
  const ICON = {
    seta: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
    voltar: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
    mais: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    copiar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>',
    zap: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1.3-3.9A8 8 0 1 1 8 19z"/></svg>',
    olho: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>'
  };

  function uuid() {
    if (crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16); });
  }
  function toast(msg) {
    const t = document.createElement('div');
    t.className = 'toast'; t.textContent = msg; t.setAttribute('role', 'status');
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 2600);
  }
  function linkDoCliente(token) {
    const base = location.href.split('#')[0].split('?')[0].replace(/[^/]*$/, '');
    return base + 'cliente.html?c=' + token;
  }

  // ==========================================================
  // Camada de dados (Supabase ou demonstração)
  // ==========================================================
  let api;
  if (DEMO) {
    document.getElementById('avisoDemo').innerHTML = '<div class="aviso"><div class="wrap"><b>Modo demonstração.</b> Os dados ficam só neste navegador. ' +
      (cfg.SUPABASE_URL ? '' : 'Preencha o config.js para usar o banco de verdade.') + '</div></div>';
    const CH = 'jornada-demo-v1';
    let mem = null;
    function ler() {
      if (mem) return mem;
      try { mem = JSON.parse(localStorage.getItem(CH)); } catch (e) { mem = null; }
      if (!mem) mem = semente();
      return mem;
    }
    function gravar() { try { localStorage.setItem(CH, JSON.stringify(mem)); } catch (e) {} }
    function semente() {
      const id = uuid();
      const base = '2026-06-10';
      const temas = J.TEMAS_PADRAO;
      return { clientes: [{
        id: id, token: uuid(), nome: 'Mariana Albuquerque', email: 'mariana@exemplo.com', whatsapp: '(81) 99999-0000', inicio: base, ativo: true,
        observacoes: 'Indicação da Dra. Paula.', updated_at: new Date().toISOString(),
        como_iniciamos: 'Renda familiar de cerca de R$ 22 mil por mês, mas sem saber exatamente para onde ia cada parte dela.\n\n- Investimentos espalhados em três bancos, sem objetivo definido\n- Nenhuma reserva separada para imprevistos',
        onde_estamos: 'O orçamento já está organizado por categorias e você passou a investir todo mês.',
        para_onde_vamos: 'Chegar ao fim deste ciclo com a reserva completa e a proteção da família estruturada.',
        reunioes: temas.map(function (t, i) { return { id: uuid(), ordem: i + 1, data: J.addMeses(base, i), tema: t, realizada: i < 3, resumo: i < 3 ? 'Resumo do encontro ' + (i + 1) + '.' : '', combinados: '' }; })
      }] };
    }
    api = {
      async sessao() { return { email: 'demonstracao' }; },
      async entrar() { return null; },
      async sair() {},
      async listar() { return JSON.parse(JSON.stringify(ler().clientes)); },
      async obter(id) { const c = ler().clientes.find(function (x) { return x.id === id; }); return c ? JSON.parse(JSON.stringify(c)) : null; },
      async criar(c, rs) {
        const novo = Object.assign({ id: uuid(), token: uuid(), ativo: true, updated_at: new Date().toISOString() }, c, { reunioes: rs.map(function (r) { return Object.assign({ id: uuid() }, r); }) });
        ler().clientes.push(novo); gravar(); return novo.id;
      },
      async salvar(c, rs) {
        const lista = ler().clientes; const i = lista.findIndex(function (x) { return x.id === c.id; });
        lista[i] = Object.assign({}, lista[i], c, { reunioes: rs, updated_at: new Date().toISOString() }); gravar();
      },
      async excluir(id) { mem.clientes = ler().clientes.filter(function (x) { return x.id !== id; }); gravar(); },
      async novoToken(id) { const c = ler().clientes.find(function (x) { return x.id === id; }); c.token = uuid(); gravar(); return c.token; }
    };
  } else {
    const sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
    function ok(r) { if (r.error) throw r.error; return r.data; }
    const CAMPOS = ['nome', 'email', 'whatsapp', 'inicio', 'observacoes', 'como_iniciamos', 'onde_estamos', 'para_onde_vamos', 'ativo'];
    function soCampos(c) { const o = {}; CAMPOS.forEach(function (k) { if (k in c) o[k] = c[k] === '' ? null : c[k]; }); return o; }
    function soReuniao(r, clienteId) { return { id: r.id, cliente_id: clienteId, ordem: r.ordem, data: r.data || null, tema: r.tema || null, realizada: !!r.realizada, resumo: r.resumo || null, combinados: r.combinados || null }; }
    api = {
      async sessao() { const s = (await sb.auth.getSession()).data.session; return s ? { email: s.user.email } : null; },
      async entrar(email, senha) { const r = await sb.auth.signInWithPassword({ email: email, password: senha }); return r.error ? 'E-mail ou senha incorretos.' : null; },
      async sair() { await sb.auth.signOut(); },
      async listar() {
        return ok(await sb.from('clientes').select('id,nome,email,token,ativo,inicio,updated_at,reunioes(id,ordem,data,tema,realizada)').order('nome'));
      },
      async obter(id) {
        const c = ok(await sb.from('clientes').select('*, reunioes(*)').eq('id', id).maybeSingle());
        return c;
      },
      async criar(c, rs) {
        const novo = ok(await sb.from('clientes').insert(soCampos(c)).select('id').single());
        if (rs.length) ok(await sb.from('reunioes').insert(rs.map(function (r) { return soReuniao(Object.assign({ id: uuid() }, r), novo.id); })));
        return novo.id;
      },
      async salvar(c, rs, removidos) {
        ok(await sb.from('clientes').update(soCampos(c)).eq('id', c.id));
        if (removidos.length) ok(await sb.from('reunioes').delete().in('id', removidos));
        if (rs.length) ok(await sb.from('reunioes').upsert(rs.map(function (r) { return soReuniao(r, c.id); })));
      },
      async excluir(id) { ok(await sb.from('clientes').delete().eq('id', id)); },
      async novoToken(id) { const t = uuid(); ok(await sb.from('clientes').update({ token: t }).eq('id', id)); return t; }
    };
  }

  // ==========================================================
  // Telas
  // ==========================================================
  async function iniciar() {
    const s = await api.sessao().catch(function () { return null; });
    if (!s) return telaLogin();
    document.getElementById('topoAcoes').innerHTML = DEMO ? '' : '<span class="sr-only">Conectada como</span><span>' + J.esc(s.email) + '</span><button class="btn ghost small" id="sair">Sair</button>';
    const b = document.getElementById('sair');
    if (b) b.onclick = async function () { await api.sair(); location.hash = ''; location.reload(); };
    window.addEventListener('hashchange', rota);
    rota();
  }

  function rota() {
    camada.innerHTML = '';
    const m = location.hash.match(/^#\/cliente\/(.+)$/);
    if (m) telaEditor(m[1]); else telaLista();
  }

  function telaLogin() {
    app.innerHTML = '<div class="login"><form class="login-card" id="fLogin">' +
      '<div class="eyebrow">Área da planejadora</div><h1>Painel de clientes</h1>' +
      '<label class="campo">E-mail<input type="email" name="email" autocomplete="username" required></label>' +
      '<label class="campo">Senha<input type="password" name="senha" autocomplete="current-password" required></label>' +
      '<div class="erro" id="erro"></div>' +
      '<button class="btn" type="submit">Entrar <span aria-hidden="true">→</span></button></form></div>';
    document.getElementById('fLogin').onsubmit = async function (e) {
      e.preventDefault();
      const f = e.target; const btn = f.querySelector('button'); btn.disabled = true;
      const erro = await api.entrar(f.email.value.trim(), f.senha.value);
      if (erro) { document.getElementById('erro').textContent = erro; btn.disabled = false; return; }
      location.reload();
    };
  }

  // ---------- Lista ----------
  let cacheLista = [];
  async function telaLista() {
    app.innerHTML = '<div class="cab"><div><div class="eyebrow">Acompanhamento</div><h1 style="margin-top:12px">Seus clientes</h1><p id="contagem">Carregando…</p></div>' +
      '<div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center"><input type="search" class="busca" id="busca" placeholder="Buscar cliente" aria-label="Buscar cliente">' +
      '<button class="btn" id="novo">' + ICON.mais + 'Novo cliente</button></div></div><div id="lista"></div>';
    document.getElementById('novo').onclick = modalNovo;
    document.getElementById('busca').oninput = function (e) { pintarLista(e.target.value); };
    try { cacheLista = await api.listar(); }
    catch (e) { document.getElementById('lista').innerHTML = '<p class="erro">Não foi possível carregar os clientes: ' + J.esc(e.message || e) + '</p>'; return; }
    pintarLista('');
  }

  function pintarLista(filtro) {
    const f = (filtro || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    const itens = cacheLista.filter(function (c) { return c.nome.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').includes(f); });
    const ativos = cacheLista.filter(function (c) { return c.ativo; }).length;
    document.getElementById('contagem').textContent = cacheLista.length ? (ativos + (ativos === 1 ? ' cliente em acompanhamento' : ' clientes em acompanhamento')) : 'Nenhum cliente cadastrado ainda';
    const alvo = document.getElementById('lista');
    if (!cacheLista.length) {
      alvo.innerHTML = '<div class="vazio-lista"><h3>Comece pelo primeiro cliente</h3><p>Cadastre o cliente, defina a data do primeiro encontro e o caminho é criado automaticamente.</p></div>';
      return;
    }
    alvo.innerHTML = '<div class="lista">' + itens.map(function (c) {
      const rs = (c.reunioes || []).slice().sort(function (a, b) { return a.ordem - b.ordem; });
      const feitas = rs.filter(function (r) { return r.realizada; }).length;
      const prox = rs.find(function (r) { return !r.realizada; });
      const idxProx = rs.indexOf(prox);
      return '<button class="cli" data-id="' + c.id + '"><div><h3>' + J.esc(c.nome) + '</h3><div class="meta">' + (c.email ? J.esc(c.email) : 'Início em ' + J.fmtCurta(c.inicio)) + '</div></div>' +
        '<div class="mini" aria-hidden="true">' + rs.map(function (r, i) { return '<span class="' + (r.realizada ? 'f' : (i === idxProx ? 'a' : '')) + '"></span>'; }).join('') + '</div>' +
        '<div class="cli-rodape"><span>' + feitas + ' de ' + rs.length + ' · ' + (prox ? 'próximo em ' + J.fmtCurta(prox.data) : 'ciclo concluído') + '</span>' +
        '<span class="status' + (c.ativo ? '' : ' off') + '">' + (c.ativo ? 'Link ativo' : 'Link desligado') + '</span></div></button>';
    }).join('') + '</div>';
    alvo.querySelectorAll('.cli').forEach(function (b) { b.onclick = function () { location.hash = '#/cliente/' + b.dataset.id; }; });
  }

  function modalNovo() {
    const hoje = J.hojeISO();
    camada.innerHTML = '<div class="modal" id="mNovo"><form class="modal-card" id="fNovo">' +
      '<div><div class="eyebrow">Novo cliente</div><h2 style="margin-top:10px">Cadastrar cliente</h2></div>' +
      '<div class="grade">' +
        '<label class="campo cheio">Nome completo<input type="text" name="nome" required></label>' +
        '<label class="campo">E-mail <small>(opcional)</small><input type="email" name="email"></label>' +
        '<label class="campo">WhatsApp <small>(opcional)</small><input type="tel" name="whatsapp" placeholder="(81) 99999-0000"></label>' +
        '<label class="campo">Data do 1º encontro<input type="date" name="inicio" value="' + hoje + '" required></label>' +
        '<label class="campo">Nº de encontros<input type="number" name="qtd" min="1" max="24" value="6" required></label>' +
        '<label class="campo cheio">Frequência<select name="freq"><option value="1">Mensal</option><option value="2">Bimestral</option></select></label>' +
      '</div>' +
      '<p style="font-size:14px;color:var(--ink-soft)">As datas e os temas dos encontros são criados automaticamente. Você ajusta tudo depois.</p>' +
      '<div class="modal-acoes"><button type="button" class="btn ghost" id="cancelar">Cancelar</button><button class="btn" type="submit">Criar caminho <span aria-hidden="true">→</span></button></div>' +
      '</form></div>';
    const m = document.getElementById('mNovo');
    m.onclick = function (e) { if (e.target === m) camada.innerHTML = ''; };
    document.getElementById('cancelar').onclick = function () { camada.innerHTML = ''; };
    m.querySelector('[name=nome]').focus();
    document.getElementById('fNovo').onsubmit = async function (e) {
      e.preventDefault();
      const f = e.target; const btn = f.querySelector('[type=submit]'); btn.disabled = true;
      const qtd = Math.max(1, Math.min(24, Number(f.qtd.value) || 6));
      const freq = Number(f.freq.value) || 1;
      const rs = [];
      for (let i = 0; i < qtd; i++) rs.push({ ordem: i + 1, data: J.addMeses(f.inicio.value, i * freq), tema: J.TEMAS_PADRAO[i] || 'Acompanhamento', realizada: false, resumo: '', combinados: '' });
      try {
        const id = await api.criar({ nome: f.nome.value.trim(), email: f.email.value.trim(), whatsapp: f.whatsapp.value.trim(), inicio: f.inicio.value }, rs);
        camada.innerHTML = '';
        location.hash = '#/cliente/' + id;
        toast('Cliente criado. O link já está pronto.');
      } catch (err) { btn.disabled = false; toast('Não foi possível criar: ' + (err.message || err)); }
    };
  }

  // ---------- Editor ----------
  let atual = null, removidos = [], mudou = false;

  function marcarMudanca() {
    mudou = true;
    const i = document.getElementById('infoSalvar');
    if (i) { i.textContent = 'Alterações não salvas'; i.classList.add('mudou'); }
  }
  window.addEventListener('beforeunload', function (e) { if (mudou) { e.preventDefault(); e.returnValue = ''; } });

  async function telaEditor(id) {
    app.innerHTML = '<p style="color:var(--ink-soft)">Carregando…</p>';
    let c;
    try { c = await api.obter(id); } catch (e) { c = null; }
    if (!c) { app.innerHTML = '<p class="erro">Cliente não encontrado.</p><p><a class="btn ghost small" href="#">Voltar</a></p>'; return; }
    atual = c;
    atual.reunioes = (c.reunioes || []).slice().sort(function (a, b) { return a.ordem - b.ordem; });
    removidos = []; mudou = false;
    pintarEditor();
  }

  function campoTexto(nome, rotulo, ajuda, valor) {
    return '<label class="campo cheio">' + rotulo + (ajuda ? ' <small>' + ajuda + '</small>' : '') +
      '<textarea data-c="' + nome + '" rows="4">' + J.esc(valor || '') + '</textarea></label>';
  }

  function pintarEditor() {
    const c = atual;
    const link = linkDoCliente(c.token);
    const msgZap = 'Oi, ' + J.primeiroNome(c.nome) + '! Preparei uma página só sua para você acompanhar a nossa jornada no planejamento financeiro. Por ela você vê nossos encontros, o que decidimos em cada um e os próximos passos: ' + link;
    let zapNum = (c.whatsapp || '').replace(/\D/g, '');
    if (zapNum && zapNum.length <= 11) zapNum = '55' + zapNum;
    const urlZap = 'https://wa.me/' + zapNum + '?text=' + encodeURIComponent(msgZap);

    app.innerHTML =
      '<button class="voltar" id="voltar">' + ICON.voltar + 'Todos os clientes</button>' +
      '<div class="cab" style="margin-bottom:0"><div><div class="eyebrow">Jornada do cliente</div><h1 style="margin-top:12px">' + J.esc(c.nome) + '</h1></div></div>' +

      '<div class="link-box"><div class="lbl">Link exclusivo do cliente</div>' +
        (c.ativo
          ? '<div class="r"><input type="text" readonly value="' + J.esc(link) + '" id="campoLink" aria-label="Link do cliente">' +
            '<button class="btn gold small" id="copiar">' + ICON.copiar + 'Copiar</button>' +
            '<a class="btn ghost small" href="' + urlZap + '" target="_blank" rel="noopener">' + ICON.zap + 'Enviar no WhatsApp</a>' +
            '<a class="btn ghost small" href="' + J.esc(link) + (DEMO ? '' : '') + '" target="_blank" rel="noopener" id="verPagina">' + ICON.olho + 'Ver página</a></div>'
          : '<p class="link-off">O link está desligado. O cliente não consegue acessar a página até você ligá-lo de novo.</p>') +
      '</div>' +

      '<div class="bloco"><h2>O caminho</h2><p class="sub">Marque cada encontro como realizado e registre o que foi decidido e combinado. Combinados: um por linha.</p>' +
        '<div id="reunioes"></div>' +
        '<button class="btn ghost small add" id="addReuniao">' + ICON.mais + 'Adicionar encontro</button></div>' +

      '<div class="bloco"><h2>Como iniciamos, onde estamos e para onde vamos</h2><p class="sub">Aparece abaixo do caminho. Para fazer tópicos, comece a linha com um traço (-).</p>' +
        '<div class="grade">' +
          campoTexto('como_iniciamos', 'Como iniciamos', '(a situação no início)', c.como_iniciamos) +
          campoTexto('onde_estamos', 'Onde estamos', '(o que já foi feito; os encontros realizados entram sozinhos)', c.onde_estamos) +
          campoTexto('para_onde_vamos', 'Para onde vamos', '(os próximos passos; os próximos encontros entram sozinhos)', c.para_onde_vamos) +
        '</div></div>' +

      '<div class="bloco"><h2>Dados do cliente</h2><p class="sub">E-mail, WhatsApp e anotações internas não aparecem para o cliente.</p>' +
        '<div class="grade">' +
          '<label class="campo cheio">Nome completo<input type="text" data-c="nome" value="' + J.esc(c.nome) + '"></label>' +
          '<label class="campo">E-mail<input type="email" data-c="email" value="' + J.esc(c.email || '') + '"></label>' +
          '<label class="campo">WhatsApp<input type="tel" data-c="whatsapp" value="' + J.esc(c.whatsapp || '') + '"></label>' +
          campoTexto('observacoes', 'Anotações internas', '(só você vê)', c.observacoes) +
        '</div>' +
        '<div class="acoes-link">' +
          '<label class="toggle"><input type="checkbox" id="ativo"' + (c.ativo ? ' checked' : '') + '> Link ativo</label>' +
          '<button class="link" id="novoLink" type="button">Gerar novo link</button>' +
          '<button class="perigo" id="excluir" type="button">Excluir cliente</button>' +
        '</div></div>';

    camada.innerHTML = '<div class="barra"><div class="wrap"><span class="info" id="infoSalvar">Tudo salvo</span>' +
      '<button class="btn" id="salvar">Salvar alterações</button></div></div>';

    pintarReunioes();

    document.getElementById('voltar').onclick = function () {
      if (mudou && !confirm('Há alterações não salvas. Sair mesmo assim?')) return;
      mudou = false; location.hash = '';
    };
    app.querySelectorAll('[data-c]').forEach(function (el) {
      el.addEventListener('input', function () { atual[el.dataset.c] = el.value; marcarMudanca(); });
    });
    document.getElementById('ativo').onchange = function (e) { atual.ativo = e.target.checked; marcarMudanca(); toast(e.target.checked ? 'O link volta a funcionar ao salvar.' : 'O link deixa de funcionar ao salvar.'); };
    document.getElementById('addReuniao').onclick = function () {
      const rs = atual.reunioes; const ult = rs[rs.length - 1];
      rs.push({ id: uuid(), ordem: rs.length + 1, data: ult && ult.data ? J.addMeses(ult.data, 1) : J.hojeISO(), tema: J.TEMAS_PADRAO[rs.length] || 'Acompanhamento', realizada: false, resumo: '', combinados: '', _aberta: true });
      marcarMudanca(); pintarReunioes();
    };
    document.getElementById('salvar').onclick = salvar;
    const cp = document.getElementById('copiar');
    if (cp) cp.onclick = function () {
      const campo = document.getElementById('campoLink');
      (navigator.clipboard ? navigator.clipboard.writeText(campo.value) : Promise.reject()).then(function () { toast('Link copiado.'); }).catch(function () { campo.select(); document.execCommand('copy'); toast('Link copiado.'); });
    };
    if (DEMO) { const v = document.getElementById('verPagina'); if (v) v.href = 'cliente.html?demo'; }
    document.getElementById('novoLink').onclick = async function () {
      if (!confirm('Gerar um novo link? O link antigo para de funcionar e você precisará enviar o novo ao cliente.')) return;
      try { atual.token = await api.novoToken(atual.id); pintarEditor(); toast('Novo link gerado.'); } catch (e) { toast('Erro: ' + (e.message || e)); }
    };
    document.getElementById('excluir').onclick = async function () {
      if (!confirm('Excluir ' + atual.nome + ' e todos os encontros? Isso não pode ser desfeito.')) return;
      try { await api.excluir(atual.id); mudou = false; location.hash = ''; toast('Cliente excluído.'); } catch (e) { toast('Erro: ' + (e.message || e)); }
    };
  }

  function pintarReunioes() {
    const alvo = document.getElementById('reunioes');
    const rs = atual.reunioes;
    if (!rs.length) { alvo.innerHTML = '<p style="color:var(--ink-soft)">Nenhum encontro ainda.</p>'; return; }
    alvo.innerHTML = rs.map(function (r, i) {
      return '<div class="reuniao' + (r.realizada ? ' feita' : '') + (r._aberta ? ' aberta' : '') + '" data-i="' + i + '">' +
        '<div class="r-cab">' +
          '<div class="r-num">' + J.num2(i + 1) + '</div>' +
          '<input type="date" class="r-data" data-r="data" value="' + J.esc(r.data || '') + '" aria-label="Data do encontro ' + (i + 1) + '">' +
          '<input type="text" class="r-tema" data-r="tema" value="' + J.esc(r.tema || '') + '" placeholder="Tema do encontro" aria-label="Tema do encontro ' + (i + 1) + '">' +
          '<label class="toggle"><input type="checkbox" data-r="realizada"' + (r.realizada ? ' checked' : '') + '> Realizado</label>' +
          '<button class="icone abrir" type="button" aria-label="Abrir detalhes do encontro ' + (i + 1) + '" aria-expanded="' + (r._aberta ? 'true' : 'false') + '">' + ICON.seta + '</button>' +
        '</div>' +
        '<div class="r-corpo">' +
          '<label class="campo">O que decidimos<textarea data-r="resumo" rows="4" placeholder="Resumo do que foi decidido neste encontro">' + J.esc(r.resumo || '') + '</textarea></label>' +
          '<label class="campo">Combinados até o próximo encontro <small>(um por linha)</small><textarea data-r="combinados" rows="4" placeholder="Enviar extratos&#10;Conectar contas no app">' + J.esc(r.combinados || '') + '</textarea></label>' +
          '<button class="remover" type="button">Remover este encontro</button>' +
        '</div></div>';
    }).join('');

    alvo.querySelectorAll('.reuniao').forEach(function (el) {
      const i = Number(el.dataset.i); const r = atual.reunioes[i];
      el.querySelectorAll('[data-r]').forEach(function (inp) {
        const ev = inp.type === 'checkbox' ? 'change' : 'input';
        inp.addEventListener(ev, function () {
          r[inp.dataset.r] = inp.type === 'checkbox' ? inp.checked : inp.value;
          if (inp.type === 'checkbox') {
            el.classList.toggle('feita', inp.checked);
            if (inp.checked && !r._aberta) { r._aberta = true; el.classList.add('aberta'); el.querySelector('[data-r=resumo]').focus(); }
          }
          marcarMudanca();
        });
      });
      el.querySelector('.abrir').onclick = function () {
        r._aberta = !r._aberta; el.classList.toggle('aberta', r._aberta);
        this.setAttribute('aria-expanded', r._aberta ? 'true' : 'false');
      };
      el.querySelector('.remover').onclick = function () {
        if (!confirm('Remover o encontro ' + (i + 1) + '?')) return;
        atual.reunioes.splice(i, 1);
        if (r.id) removidos.push(r.id);
        atual.reunioes.forEach(function (x, k) { x.ordem = k + 1; });
        marcarMudanca(); pintarReunioes();
      };
    });
  }

  async function salvar() {
    const btn = document.getElementById('salvar');
    if (!atual.nome || !atual.nome.trim()) { toast('Preencha o nome do cliente.'); return; }
    btn.disabled = true; btn.textContent = 'Salvando…';
    atual.reunioes.forEach(function (r, k) { r.ordem = k + 1; if (!r.id) r.id = uuid(); });
    atual.inicio = (atual.reunioes[0] && atual.reunioes[0].data) || atual.inicio || null;
    const limpas = atual.reunioes.map(function (r) { return { id: r.id, ordem: r.ordem, data: r.data, tema: r.tema, realizada: !!r.realizada, resumo: r.resumo || '', combinados: r.combinados || '' }; });
    try {
      await api.salvar(atual, limpas, removidos);
      removidos = []; mudou = false;
      const i = document.getElementById('infoSalvar'); i.textContent = 'Tudo salvo'; i.classList.remove('mudou');
      toast('Alterações salvas. O cliente já vê a versão nova.');
      if (document.getElementById('campoLink') === null && atual.ativo) pintarEditor();
      if (document.getElementById('campoLink') && !atual.ativo) pintarEditor();
    } catch (e) { toast('Não foi possível salvar: ' + (e.message || e)); }
    btn.disabled = false; btn.textContent = 'Salvar alterações';
  }

  iniciar();
})();
</script>
</body>
</html>
